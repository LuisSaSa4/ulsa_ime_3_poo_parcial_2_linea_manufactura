    <text x="957" y="695" class="text">+ procesar(pieza: Pieza&amp;) = 0</text>
    <text x="957" y="714" class="text">+ realizarMantenimiento()</text>
    <text x="957" y="755" class="text">La operación polimórfica ahora recibe la pieza para actualizarla.</text>
  </g>

