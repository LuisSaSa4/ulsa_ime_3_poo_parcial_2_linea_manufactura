    <text x="2100" y="139" text-anchor="middle" class="name">Pieza</text>
    <line x1="1770" y1="149" x2="2430" y2="149" class="rule"/>
    <text x="1787" y="174" class="text">- int id</text>
    <text x="1787" y="194" class="text">- double desviacionAcumulada</text>
    <text x="1787" y="214" class="text">- double tolerancia</text>
    <text x="1787" y="234" class="text">- EstadoPieza estado</text>
    <line x1="1770" y1="244" x2="2430" y2="244" class="rule"/>
    <text x="1787" y="268" class="text">+ agregarDesviacion(valor)</text>
    <text x="1787" y="288" class="text">+ aprobar() · rechazar()</text>
    <text x="1787" y="325" class="text">Conserva la desviación y el resultado de inspección.</text>
  </g>

