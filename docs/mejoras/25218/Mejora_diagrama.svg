  <rect width="2600" height="1650" fill="#050505"/>
  <text x="55" y="42" class="heading">Diagrama de clases: inspección y rechazo de piezas</text>
  <text x="55" y="70" class="legend">Etiquetas: NUEVA = clase agregada · EXISTENTE / MODIFICADA = clase que cambia · EXISTENTE = clase sin cambios</text>

