  <!-- Planta -->
  <g>
    <rect x="930" y="90" width="660" height="235" fill="#28108c" stroke="#633cff" stroke-width="3"/>
    <rect x="930" y="90" width="660" height="24" fill="#4217db"/>
    <text x="943" y="107" class="badge">EXISTENTE / MODIFICADA</text>
    <text x="1260" y="139" text-anchor="middle" class="name">Planta</text>
    <line x1="930" y1="149" x2="1590" y2="149" class="rule"/>
    <text x="947" y="171" class="text">- vector&lt;Maquina*&gt; maquinas</text>
    <text x="947" y="190" class="text">- int piezasTerminadas · piezasAprobadas · piezasRechazadas</text>
    <line x1="930" y1="199" x2="1590" y2="199" class="rule"/>
    <text x="947" y="220" class="text">+ agregarMaquina(Maquina*) · encenderMaquinas() · apagarMaquinas()</text>
    <text x="947" y="239" class="text">+ procesarPieza() · procesarLote(int)</text>
    <text x="947" y="258" class="text">+ mostrarReporte() const</text>
    <text x="947" y="291" class="text">Crea las piezas, cuenta aprobadas y rechazadas.</text>
    <text x="947" y="310" class="text">Las máquinas siguen siendo externas a su ciclo de vida.</text>
  </g>

  <!-- Pieza -->
  <g>
    <rect x="1770" y="90" width="660" height="260" fill="#07522c" stroke="#21c86a" stroke-width="3"/>
    <rect x="1770" y="90" width="660" height="24" fill="#07803e"/>
